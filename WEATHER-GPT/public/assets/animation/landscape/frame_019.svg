        <stop offset="45%" stop-color="#58c7ff" stop-opacity="0.4" />
        <stop offset="85%" stop-color="#ff5e6c" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#040914" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#58c7ff" stop-opacity="0.85" />
        <stop offset="65%" stop-color="#145374" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#040914" stop-opacity="0" />
      </radialGradient>
      <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  
