<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
      
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="hsl(213.61702127659575, 57.765957446808514%, 7.9787234042553195%)" />
        <stop offset="60%" stop-color="hsl(218.72340425531914, 57.765957446808514%, 3.702127659574468%)" />
        <stop offset="100%" stop-color="#040914" />
      </linearGradient>
      <radialGradient id="satelliteGlow" cx="50%" cy="50%" r="50%">
