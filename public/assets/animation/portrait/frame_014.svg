        <stop offset="25%" stop-color="#58c7ff" stop-opacity="0.85" />
        <stop offset="65%" stop-color="#145374" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#040914" stop-opacity="0" />
      </radialGradient>
      <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
