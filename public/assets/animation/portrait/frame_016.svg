        <stop offset="45%" stop-color="#58c7ff" stop-opacity="0.4" />
        <stop offset="85%" stop-color="#ff5e6c" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#040914" stop-opacity="0" />
